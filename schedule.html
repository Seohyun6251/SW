<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 학습 시간표</title>
    <link rel="stylesheet" href="common.css">
    <style>
        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin: auto;
        }
        th, td {
            height: 45px;
            padding: 4px;
            box-sizing: border-box;
            overflow: hidden;
            overflow-wrap: anywhere;
        }
        #weekdayHeader th:not(:first-child) {
            white-space: nowrap;
            line-height: 1.25;
        }
        #weekdayHeader th small {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            font-weight: normal;
        }
        td.scheduled {
            background-color: #dceeff;
            text-align: center;
            font-weight: bold;
        }
        .update-link {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 44px;
            margin: 0;
            padding: 0 12px;
            border: 1px solid black;
            border-radius: 5px;
            background-color: black;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
        .update-link:hover {
            background-color: #333;
        }
        .schedule-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 12px;
            width: min(100%, 380px);
            margin-top: 24px;
            margin-right: auto;
            margin-left: auto;
        }
        .complete-button {
            flex: 1;
            min-width: 0;
            height: 44px;
            padding: 0 12px;
            border: 1px solid black;
            border-radius: 5px;
            background-color: black;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }
        .complete-button:hover:not(:disabled) { background-color: #333; }
        .complete-button:disabled {
            border-color: #aaa;
            background-color: #aaa;
            color: #eee;
            cursor: not-allowed;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 16px 0;
        }
        .content {
            min-height: 300px;
            padding: 32px;
        }
        @media (max-width: 560px) {
            .content { padding: 12px; }
            th, td { height: 38px; padding: 2px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <main class="content">
        <h1 style="text-align: center;">주간 학습 시간표</h1>
        <table border="1">
            <thead>
                <tr id="weekdayHeader">
                    <th>시간/요일</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
        <div class="schedule-actions">
            <a class="update-link" href="update.html">보충 필요 과목 입력</a>
            <button id="completeMakeupButton" class="complete-button" type="button" disabled>보충 완료</button>
        </div>
    </main>

    <script>
        const weekdayHeader = document.getElementById('weekdayHeader');
        const scheduleBody = document.getElementById('scheduleBody');
        const completeMakeupButton = document.getElementById('completeMakeupButton');
        const weekdayNames = ['월', '화', '수', '목', '금', '토', '일'];

        function hourKey(hour) {
            return String(hour).padStart(2, '0');
        }

        function renderSchedule(data) {
            completeMakeupButton.disabled = !data.allocations.some(
                (subject) => Number(subject.temporaryNeedBonus) > 0
            );

            for (let index = 0; index < data.weekDates.length; index++) {
                const dateText = data.weekDates[index];
                const [, month, day] = dateText.split('-').map(Number);
                const heading = document.createElement('th');
                const weekdayLabel = document.createElement('span');
                const dateLabel = document.createElement('small');
                weekdayLabel.textContent = weekdayNames[index];
                dateLabel.textContent = `(${month}.${day})`;
                heading.append(weekdayLabel, dateLabel);
                weekdayHeader.appendChild(heading);
            }

            for (let hour = 9; hour <= 21; hour++) {
                const row = document.createElement('tr');
                const timeCell = document.createElement('th');
                timeCell.textContent = `${hour}~${hour + 1}`;
                row.appendChild(timeCell);

                for (const dateText of data.weekDates) {
                    const cell = document.createElement('td');
                    cell.id = `slot_${dateText}_${hourKey(hour)}`;
                    row.appendChild(cell);
                }

                scheduleBody.appendChild(row);
            }

            for (const item of data.schedule) {
                const cellId = `slot_${item.studyDate}_${hourKey(item.startHour)}`;
                const cell = document.getElementById(cellId);

                if (cell) {
                    cell.textContent = item.subjectName;
                    cell.classList.add('scheduled');
                }
            }

        }

        completeMakeupButton.addEventListener('click', async () => {
            if (completeMakeupButton.disabled) return;

            try {
                const response = await fetch('/api/schedule/complete-makeup', {
                    method: 'POST'
                });
                const result = await response.json();
                if (!response.ok) {
                    alert(result.message || '보충 완료 처리를 하지 못했습니다.');
                    return;
                }

                window.location.reload();
            } catch (error) {
                alert('보충 완료 처리를 하지 못했습니다.');
                console.error('보충 완료 요청 오류:', error);
            }
        });

        function logScheduleCalculations(data) {
            console.group('공부 시간표 알고리즘 계산');
            console.log('우선순위 수식: 중요도 × 현재 필요도 ÷ √시험까지 남은 일수');
            console.table(data.allocations.map((subject) => ({
                과목: subject.name,
                중요도: subject.importance,
                기본필요도: subject.studyNeed,
                임시필요도보너스: subject.temporaryNeedBonus,
                영구필요도보너스: subject.permanentNeedBonus,
                현재필요도: subject.currentNeed,
                시험까지_일수: subject.daysUntilExam,
                우선순위: subject.priority,
                이번주목표시간: subject.weeklyTargetSlots ?? subject.allocatedSlots,
                실제주간배정: subject.allocatedSlots
            })));

            const subjectCount = data.allocations.length;
            const totalSlots = data.totalAvailableSlots;
            const basePerSubject = totalSlots >= subjectCount ? 1 : 0;
            const baseSlots = basePerSubject * subjectCount;
            const extraSlots = totalSlots - baseSlots;
            const priorityTotal = data.allocations.reduce(
                (sum, subject) => sum + subject.priority,
                0
            );
            console.log(`시간 배분 수식: 과목별 기본 ${basePerSubject}시간 + 남은 ${extraSlots}시간 × (과목 우선순위 ÷ 전체 우선순위 합)`);
            console.log(`입력값: 앞으로 가능한 시간 ${totalSlots}칸, 과목 ${subjectCount}개, 기본 배정 ${baseSlots}칸, 추가 배정 ${extraSlots}칸, 전체 우선순위 합 ${priorityTotal}`);
            console.table(data.allocations.map((subject) => {
                const ratio = priorityTotal === 0
                    ? 1 / subjectCount
                    : subject.priority / priorityTotal;
                const exactExtra = extraSlots * ratio;
                return {
                    과목: subject.name,
                    우선순위비율: ratio,
                    추가시간_정확값: exactExtra,
                    소수점버림후_기본시간포함: basePerSubject + Math.floor(exactExtra),
                    소수점배분_주간목표시간: subject.weeklyTargetSlots ?? subject.allocatedSlots,
                    지난시간_반영후_실제주간배정: subject.allocatedSlots
                };
            }));

            console.log('시간표 배치 기준: 지난 배정량을 포함해 주간 목표를 계산하고, 남은 목표가 남은 시험 전 시간에 비해 큰 과목부터 연속 시간 블록으로 배치합니다.');
            console.table(data.schedule.map((item, index) => ({
                순서: index + 1,
                공부일: item.studyDate,
                시작시간: `${item.startHour}:00`,
                배정과목: item.subjectName,
                배정전후보: (item.candidates || []).map((candidate) =>
                    `${candidate.subjectName}: 배정시간 ${candidate.allocatedSlots}, 남은비율 ${candidate.urgency.toFixed(2)}, 우선순위 ${candidate.priority.toFixed(2)}`
                ).join(' | ')
            })));
            console.groupEnd();
        }

        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const result = await response.json();

                if (!response.ok) {
                    alert(result.message || '시간표를 만들지 못했습니다.');
                    return;
                }

                logScheduleCalculations(result);
                renderSchedule(result);
            } catch (error) {
                alert('시간표를 불러오지 못했습니다. 서버가 실행 중인지 확인해 주세요.');
                console.error('시간표 조회 오류:', error);
            }
        }

        loadSchedule();
    </script>
    <script src="page-nav.js" defer></script>
</body>
</html>

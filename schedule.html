<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 학습 시간표</title>
    <style>
        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin: auto;
        }
        th, td {
            height: 45px;
            padding: 4px;
            box-sizing: border-box;
            overflow: hidden;
            overflow-wrap: anywhere;
        }
        #weekdayHeader th:not(:first-child) {
            white-space: nowrap;
            line-height: 1.25;
        }
        #weekdayHeader th small {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            font-weight: normal;
        }
        #weekdayHeader th:not(:first-child) {
            white-space: nowrap;
            line-height: 1.25;
        }
        #weekdayHeader th small {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            font-weight: normal;
        }
        td.scheduled {
            background-color: #dceeff;
            text-align: center;
            font-weight: bold;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(253, 250, 250);
            padding: 30px 16px 0;
            margin: 0;
        }
        .content {
            width: min(700px, 100%);
            min-height: 300px;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background-color: white;
            box-sizing: border-box;
        }
        #scheduleMessage {
            text-align: center;
            min-height: 1.5em;
        }
        @media (max-width: 560px) {
            .content { padding: 12px; }
            th, td { height: 38px; padding: 2px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <main class="content">
        <h1 style="text-align: center;">주간 학습 시간표</h1>
        <table border="1">
            <thead>
                <tr id="weekdayHeader">
                    <th>시간/요일</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
        <p id="scheduleMessage" aria-live="polite"></p>
    </main>

    <script>
        const weekdayHeader = document.getElementById('weekdayHeader');
        const scheduleBody = document.getElementById('scheduleBody');
        const scheduleMessage = document.getElementById('scheduleMessage');
        const weekdayNames = ['월', '화', '수', '목', '금', '토', '일'];

        function hourKey(hour) {
            return String(hour).padStart(2, '0');
        }

        function renderSchedule(data) {
            for (let index = 0; index < data.weekDates.length; index++) {
                const dateText = data.weekDates[index];
                const [year, month, day] = dateText.split('-').map(Number);
                const heading = document.createElement('th');
                const weekdayLabel = document.createElement('span');
                const dateLabel = document.createElement('small');
                const date = new Date(year, month - 1, day);

                weekdayLabel.textContent = weekdayNames[index];
                dateLabel.textContent = `(${month}.${day})`;
                heading.append(weekdayLabel, dateLabel);
                weekdayHeader.appendChild(heading);
            }

            for (let hour = 9; hour <= 21; hour++) {
                const row = document.createElement('tr');
                const timeCell = document.createElement('th');
                timeCell.textContent = `${hour}~${hour + 1}`;
                row.appendChild(timeCell);

                for (const dateText of data.weekDates) {
                    const cell = document.createElement('td');
                    cell.id = `slot_${dateText}_${hourKey(hour)}`;
                    row.appendChild(cell);
                }

                scheduleBody.appendChild(row);
            }

            for (const item of data.schedule) {
                const cellId = `slot_${item.studyDate}_${hourKey(item.startHour)}`;
                const cell = document.getElementById(cellId);

                if (cell) {
                    cell.textContent = item.subjectName;
                    cell.classList.add('scheduled');
                }
            }

            scheduleMessage.textContent = '저장된 과목과 공부 가능 시간을 바탕으로 만든 시간표입니다.';
        }

        function logScheduleCalculations(data) {
            console.group('공부 시간표 알고리즘 계산');
            console.log('우선순위 수식: 중요도 × 현재 필요도 ÷ √시험까지 남은 일수');
            console.table(data.allocations.map((subject) => ({
                과목: subject.name,
                중요도: subject.importance,
                기본필요도: subject.studyNeed,
                임시필요도보너스: subject.temporaryNeedBonus,
                영구필요도보너스: subject.permanentNeedBonus,
                현재필요도: subject.currentNeed,
                시험까지_일수: subject.daysUntilExam,
                우선순위: subject.priority
            })));

            const subjectCount = data.allocations.length;
            const totalSlots = data.totalAvailableSlots;
            const extraSlots = totalSlots - subjectCount;
            const priorityTotal = data.allocations.reduce(
                (sum, subject) => sum + subject.priority,
                0
            );
            console.log(`시간 배분 수식: 과목별 1시간 + 남은 ${extraSlots}시간 × (과목 우선순위 ÷ 전체 우선순위 합)`);
            console.log(`입력값: 선택 가능 시간 ${totalSlots}칸, 과목 ${subjectCount}개, 기본 배정 ${subjectCount}칸, 추가 배정 ${extraSlots}칸, 전체 우선순위 합 ${priorityTotal}`);
            console.table(data.allocations.map((subject) => {
                const ratio = priorityTotal === 0
                    ? 1 / subjectCount
                    : subject.priority / priorityTotal;
                const exactExtra = extraSlots * ratio;
                return {
                    과목: subject.name,
                    우선순위비율: ratio,
                    추가시간_정확값: exactExtra,
                    소수점버림후_기본1시간포함: 1 + Math.floor(exactExtra),
                    가장큰소수점배분후_최종시간: subject.allocatedSlots
                };
            }));

            console.log('시간표 배치 기준: 시험일이 공부 날짜보다 늦거나 같은 과목 중, (이미 배정한 시간 ÷ 목표 시간)이 가장 낮은 과목을 선택합니다. 비율이 같으면 우선순위가 높은 과목을 선택합니다.');
            console.table(data.schedule.map((item, index) => ({
                순서: index + 1,
                공부일: item.studyDate,
                시작시간: `${item.startHour}:00`,
                배정과목: item.subjectName,
                배정전후보: item.candidates.map((candidate) =>
                    `${candidate.subjectName}: ${candidate.assignedBefore}/${candidate.allocatedSlots} (${(candidate.progress * 100).toFixed(1)}%), 우선순위 ${candidate.priority.toFixed(2)}`
                ).join(' | ')
            })));
            console.groupEnd();
        }

        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const result = await response.json();

                if (!response.ok) {
                    scheduleMessage.textContent = result.message || '시간표를 만들지 못했습니다.';
                    return;
                }

                logScheduleCalculations(result);
                renderSchedule(result);
            } catch (error) {
                scheduleMessage.textContent = '서버에 연결할 수 없습니다.';
                console.error('시간표 조회 오류:', error);
            }
        }

        loadSchedule();
    </script>
</body>
</html>

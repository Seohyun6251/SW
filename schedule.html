<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 학습 시간표</title>
    <link rel="stylesheet" href="common.css">
    <style>
        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin: auto;
        }
        th, td {
            height: 45px;
            padding: 4px;
            box-sizing: border-box;
            overflow: hidden;
            overflow-wrap: anywhere;
            border: 1px solid #dce4e9;
            text-align: center;
        }
        .schedule-table thead th {
            background: #f3f7f9;
            color: #43545e;
        }
        #weekdayHeader th:not(:first-child) {
            white-space: nowrap;
            line-height: 1.25;
        }
        #weekdayHeader th small {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            font-weight: normal;
        }
        td.scheduled {
            background-color: var(--subject-color, #dceeff);
            font-weight: bold;
        }
        .update-link {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 44px;
            margin: 0;
            padding: 0 12px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
        .update-link:hover {
            border-color: #23698e;
            background-color: #23698e;
        }
        .schedule-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 12px;
            width: min(100%, 380px);
            margin-top: 24px;
            margin-right: auto;
            margin-left: auto;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 16px 0;
        }
        .content {
            min-height: 300px;
            padding: 32px;
        }
        @media (max-width: 560px) {
            .content { padding: 12px; }
            th, td { height: 38px; padding: 2px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <main class="content">
        <h1 class="page-title" style="text-align: center;">주간 학습 시간표</h1>

        <nav class="stepper" aria-label="시간표 생성 단계">
            <div class="step-item is-complete"><span class="step-number">1</span>과목 등록</div>
            <div class="step-item is-complete"><span class="step-number">2</span>공부 시간</div>
            <div class="step-item is-active"><span class="step-number">3</span>시간표</div>
        </nav>

        <section class="schedule-overview" aria-label="주간 배정 요약">
            <div class="summary-strip">
                <span>이번 주 배정 시간</span>
                <span><strong id="scheduledHours">0</strong>시간</span>
            </div>
            <div id="subjectLegend" class="subject-legend" aria-label="과목별 배정 시간"></div>
        </section>

        <table class="schedule-table">
            <thead>
                <tr id="weekdayHeader">
                    <th>시간/요일</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
        <div class="schedule-actions">
            <a class="update-link" href="update.html">보충 필요 과목 입력</a>
        </div>
    </main>

    <script>
        const weekdayHeader = document.getElementById('weekdayHeader');
        const scheduleBody = document.getElementById('scheduleBody');
        const scheduledHours = document.getElementById('scheduledHours');
        const subjectLegend = document.getElementById('subjectLegend');
        const weekdayNames = ['월', '화', '수', '목', '금', '토', '일'];
        const subjectColors = [
            '#dceeff', '#dff2e6', '#eee5fa', '#ffe9d8',
            '#fff1c9', '#dff1f0', '#f8e1e7', '#e7eafc'
        ];

        function hourKey(hour) {
            return String(hour).padStart(2, '0');
        }

        function renderSchedule(data) {
            const colorBySubject = new Map();
            const hoursBySubject = new Map();
            data.allocations.forEach((subject, index) => {
                colorBySubject.set(Number(subject.id), subjectColors[index % subjectColors.length]);
                hoursBySubject.set(Number(subject.id), 0);
            });
            for (const item of data.schedule) {
                const subjectId = Number(item.subjectId);
                hoursBySubject.set(subjectId, (hoursBySubject.get(subjectId) || 0) + 1);
            }
            scheduledHours.textContent = String(data.scheduledSlotCount ?? data.schedule.length);
            subjectLegend.replaceChildren();
            data.allocations.forEach((subject, index) => {
                const item = document.createElement('span');
                item.className = 'legend-item';
                const swatch = document.createElement('span');
                swatch.className = 'legend-swatch';
                swatch.style.setProperty('--subject-color', subjectColors[index % subjectColors.length]);
                const label = document.createElement('span');
                label.textContent = `${subject.name} ${hoursBySubject.get(Number(subject.id)) || 0}시간`;
                item.append(swatch, label);
                subjectLegend.appendChild(item);
            });

            for (let index = 0; index < data.weekDates.length; index++) {
                const dateText = data.weekDates[index];
                const [, month, day] = dateText.split('-').map(Number);
                const heading = document.createElement('th');
                const weekdayLabel = document.createElement('span');
                const dateLabel = document.createElement('small');
                weekdayLabel.textContent = weekdayNames[index];
                dateLabel.textContent = `(${month}.${day})`;
                heading.append(weekdayLabel, dateLabel);
                weekdayHeader.appendChild(heading);
            }

            for (let hour = 9; hour <= 21; hour++) {
                const row = document.createElement('tr');
                const timeCell = document.createElement('th');
                timeCell.textContent = `${hour}~${hour + 1}`;
                row.appendChild(timeCell);

                for (const dateText of data.weekDates) {
                    const cell = document.createElement('td');
                    cell.id = `slot_${dateText}_${hourKey(hour)}`;
                    row.appendChild(cell);
                }

                scheduleBody.appendChild(row);
            }

            for (const item of data.schedule) {
                const cellId = `slot_${item.studyDate}_${hourKey(item.startHour)}`;
                const cell = document.getElementById(cellId);

                if (cell) {
                    cell.textContent = item.subjectName;
                    cell.style.setProperty(
                        '--subject-color',
                        colorBySubject.get(Number(item.subjectId)) || subjectColors[0]
                    );
                    cell.classList.add('scheduled');
                }
            }

        }

        function logScheduleCalculations(data) {
            console.group('공부 시간표 알고리즘 계산');
            console.log('우선순위 수식: 중요도 × 현재 필요도 ÷ √시험까지 남은 일수');
            console.table(data.allocations.map((subject) => ({
                과목: subject.name,
                중요도: subject.importance,
                기본필요도: subject.studyNeed,
                임시보너스: subject.temporaryNeedBonus,
                영구보너스: subject.permanentNeedBonus,
                현재필요도: subject.currentNeed,
                우선순위: subject.priority,
                // 이번주목표시간: subject.weeklyTargetSlots ?? subject.allocatedSlots,
                // 실제주간배정: subject.allocatedSlots
            })));

            const subjectCount = data.allocations.length;
            const totalSlots = data.allocationSlotCount;
            const basePerSubject = totalSlots >= subjectCount ? 1 : 0;
            const baseSlots = basePerSubject * subjectCount;
            const extraSlots = totalSlots - baseSlots;
            const priorityTotal = data.allocations.reduce(
                (sum, subject) => sum + subject.priority,
                0
            );
            console.log(`시간 배분 수식: 과목별 기본 ${basePerSubject}시간 + 남은 ${extraSlots}시간 × (과목 우선순위 ÷ 전체 우선순위 합)`);
            console.log(`입력값: 이번 주 배정 기준 ${totalSlots}칸, 과목 ${subjectCount}개, 기본 배정 ${baseSlots}칸, 추가 배정 ${extraSlots}칸, 저장된 배정 ${data.scheduledSlotCount}칸, 전체 우선순위 합 ${priorityTotal}`);
            console.table(data.allocations.map((subject) => {
                const ratio = priorityTotal === 0
                    ? 1 / subjectCount
                    : subject.priority / priorityTotal;
                const exactExtra = extraSlots * ratio;
                return {
                    과목: subject.name,
                    // 우선순위비율: ratio,
                    추가시간_정확값: exactExtra,
                    소수점버림후_기본시간포함: basePerSubject + Math.floor(exactExtra),
                    소수점배분후_주간목표: subject.weeklyTargetSlots ?? subject.allocatedSlots,
                    실제주간배정: subject.allocatedSlots
                };
            }));

            console.log(`시간표에 저장된 공부 칸: ${data.scheduledSlotCount}칸`);
            console.groupEnd();
        }

        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const result = await response.json();

                if (!response.ok) {
                    alert(result.message || '시간표를 만들지 못했습니다.');
                    return;
                }

                logScheduleCalculations(result);
                renderSchedule(result);
            } catch (error) {
                alert('시간표를 불러오지 못했습니다. 서버가 실행 중인지 확인해 주세요.');
                console.error('시간표 조회 오류:', error);
            }
        }

        loadSchedule();
    </script>
    <script src="page-nav.js" defer></script>
</body>
</html>

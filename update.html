<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보충 시간 입력</title>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: rgb(253, 250, 250);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .content {
            width: min(700px, 100%);
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background-color: white;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }

        .subject-list {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .subject-row {
            display: grid;
            grid-template-columns: 1fr minmax(120px, 180px);
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #ccc;
        }

        .subject-name {
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            height: 39px;
            padding: 8px;
            border: solid 1px #888;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            display: block;
            flex: 1;
            min-width: 0;
            height: 44px;
            margin: 0;
            border: 1px solid black;
            border-radius: 5px;
            background-color: black;
            color: white;
            cursor: pointer;
            font-size: 14px;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #333;
        }

        .form-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: min(100%, 340px);
            margin-top: 24px;
            margin-right: auto;
            margin-left: auto;
        }

        @media (max-width: 560px) {
            .content {
                padding: 20px;
            }

            .subject-row {
                grid-template-columns: 1fr 120px;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <main class="content">
        <h1>보충 시간 입력</h1>
        <form id="replanForm">
            <section id="subjectList" class="subject-list"></section>
            <div class="form-buttons">
                <button type="button" onclick="location.href='schedule.html'">이전</button>
                <button type="submit">확인</button>
            </div>
        </form>
    </main>

    <script>
        const subjectList = document.getElementById('subjectList');
        const replanForm = document.getElementById('replanForm');

        async function loadSubjects() {
            try {
                const response = await fetch('/api/subjects');
                const subjects = await response.json();

                if (!response.ok) {
                    throw new Error(subjects.message || '과목을 불러오지 못했습니다.');
                }

                subjectList.replaceChildren();
                if (subjects.length === 0) {
                    return;
                }

                for (const subject of subjects) {
                    const row = document.createElement('div');
                    row.className = 'subject-row';

                    const name = document.createElement('span');
                    name.className = 'subject-name';
                    name.textContent = subject.name;

                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = '1';
                    input.min = '0';
                    input.id = `subject-${subject.id}`;
                    input.setAttribute('aria-label', `${subject.name} 보충할 시간`);

                    row.append(name, input);
                    subjectList.appendChild(row);
                }
            } catch (error) {
                alert(error.message || '과목을 불러오지 못했습니다.');
            }
        }

        replanForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const requests = [...subjectList.querySelectorAll('input[type="number"]')]
                .filter((input) => Number(input.value) > 0)
                .map((input) => ({
                    subjectId: Number(input.id.replace('subject-', '')),
                    hours: Number(input.value)
                }));

            try {
                const response = await fetch('/api/schedule/replan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requests })
                });
                const result = await response.json();
                if (!response.ok) {
                    alert(result.message || '시간표를 다시 계산하지 못했습니다.');
                    return;
                }

                window.location.href = 'schedule.html';
            } catch (error) {
                alert('시간표를 다시 계산하지 못했습니다.');
                console.error('시간표 재계산 요청 오류:', error);
            }
        });

        loadSubjects();
    </script>
</body>

</html>

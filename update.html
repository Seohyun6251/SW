<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보충 시간 입력</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .content {
            padding: 36px;
        }

        h1 {
            text-align: center;
        }

        .subject-list {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .form-note {
            margin: 18px 0 0;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        .subject-row {
            display: grid;
            grid-template-columns: 1fr minmax(120px, 180px);
            align-items: center;
            gap: 16px;
            padding: 12px;
            border: 1px solid #e0e7eb;
            border-radius: 12px;
            background: #fbfdfe;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }

        .subject-row:focus-within {
            border-color: #82b9d3;
            box-shadow: 0 0 0 3px rgba(43, 125, 168, 0.1);
        }

        .subject-name {
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            height: 39px;
            padding: 8px;
            border: solid 1px #c7d1d7;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="number"]:focus {
            outline: 2px solid rgba(43, 125, 168, 0.22);
            border-color: #2b7da8;
        }

        button {
            display: block;
            flex: 1;
            min-width: 0;
            height: 44px;
            margin: 0;
            border: 1px solid black;
            border-radius: 5px;
            background-color: black;
            color: white;
            cursor: pointer;
            font-size: 14px;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #333;
        }

        button:disabled {
            border-color: #aaa;
            background-color: #aaa;
            cursor: not-allowed;
        }

        .form-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: min(100%, 340px);
            margin-top: 24px;
            margin-right: auto;
            margin-left: auto;
        }

        @media (max-width: 560px) {
            .content {
                padding: 20px;
            }

            .subject-row {
                grid-template-columns: 1fr 120px;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <main class="content">
        <h1 class="page-title">보충 시간 입력</h1>
        <form id="replanForm">
            <p class="form-note">입력한 시간은 과목별로 저장돼요. 같은 과목을 다시 입력하면 그 과목의 값만 바뀌고, 0을 입력하면 해당 요청을 취소해요.</p>
            <div class="summary-strip" aria-live="polite">
                <span>현재 입력한 보충 시간</span>
                <span><strong id="totalMakeupHours">0</strong>시간</span>
            </div>
            <section id="subjectList" class="subject-list"></section>
            <div class="form-buttons">
                <button type="button" onclick="location.href='schedule.html'">이전</button>
                <button type="submit">확인</button>
            </div>
        </form>
    </main>

    <script>
        const subjectList = document.getElementById('subjectList');
        const replanForm = document.getElementById('replanForm');
        const submitButton = replanForm.querySelector('button[type="submit"]');
        const totalMakeupHours = document.getElementById('totalMakeupHours');

        function updateMakeupTotal() {
            const total = [...subjectList.querySelectorAll('input[type="number"]')]
                .reduce((sum, input) => sum + (input.value === '' ? 0 : Number(input.value)), 0);
            totalMakeupHours.textContent = String(total);
        }

        async function loadSubjects() {
            try {
                const [subjectsResponse, requestsResponse] = await Promise.all([
                    fetch('/api/subjects'),
                    fetch('/api/schedule/makeup-requests')
                ]);
                const subjects = await subjectsResponse.json();
                const requests = await requestsResponse.json();

                if (!subjectsResponse.ok) {
                    throw new Error(subjects.message || '과목을 불러오지 못했습니다.');
                }
                if (!requestsResponse.ok) {
                    throw new Error(requests.message || '저장된 보충 시간을 불러오지 못했습니다.');
                }

                subjectList.replaceChildren();
                const savedHours = new Map(requests.map((request) => [
                    Number(request.subject_id),
                    Number(request.requested_hours)
                ]));
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const activeSubjects = subjects.filter((subject) => subject.exam_date > today);
                submitButton.disabled = activeSubjects.length === 0;
                if (activeSubjects.length === 0) {
                    return;
                }

                for (const subject of activeSubjects) {
                    const row = document.createElement('div');
                    row.className = 'subject-row';

                    const name = document.createElement('span');
                    name.className = 'subject-name';
                    name.textContent = subject.name;

                    const input = document.createElement('input');
                    input.type = 'number';
                    input.step = '1';
                    input.min = '0';
                    input.id = `subject-${subject.id}`;
                    input.placeholder = '시간';
                    if (savedHours.has(Number(subject.id))) {
                        input.value = savedHours.get(Number(subject.id));
                    }
                    input.setAttribute('aria-label', `${subject.name} 보충할 시간`);
                    input.addEventListener('input', updateMakeupTotal);

                    row.append(name, input);
                    subjectList.appendChild(row);
                }
                updateMakeupTotal();
            } catch (error) {
                alert(error.message || '과목을 불러오지 못했습니다.');
            }
        }

        replanForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!replanForm.reportValidity()) return;
            const requests = [...subjectList.querySelectorAll('input[type="number"]')]
                .map((input) => ({
                    subjectId: Number(input.id.replace('subject-', '')),
                    hours: input.value === '' ? 0 : Number(input.value)
                }));

            try {
                const response = await fetch('/api/schedule/replan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requests })
                });
                const result = await response.json();
                if (!response.ok) {
                    alert(result.message || '시간표를 다시 계산하지 못했습니다.');
                    return;
                }

                window.location.href = 'schedule.html';
            } catch (error) {
                alert('시간표를 다시 계산하지 못했습니다.');
                console.error('시간표 재계산 요청 오류:', error);
            }
        });

        loadSubjects();
    </script>
    <script src="page-nav.js" defer></script>
</body>

</html>

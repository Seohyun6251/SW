<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 및 회원가입</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: rgb(253, 250, 250);
        }

        .content {
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background-color: white;
        }

        .input_d {
            margin: 20px;
        }

        input {
            width: 100%;
            height: 39px;
            border-radius: 5px;
            border: solid 1px;
            box-sizing: border-box;
        }

        label {
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            height: 40px;
            border-radius: 5px;
            border: solid 1px;
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <div class="content">
        <h2 style="text-align: center;">로그인 페이지</h2>
        <form id="authForm">
            <div class="input_d">
                <label style="display: block;">아이디</label>
                <input type="text" id="ID" name="username" required>
            </div>
            <div class="input_d">
                <label style="display: block;">비밀번호</label>
                <input type="password" id="PW" name="password" required>
            </div>
            <div style="display: flex; gap: 10px; margin: 20px">
                <button type="submit" name="action" value="login">로그인</button>
                <button type="submit" name="action" value="signup">회원가입</button>
            </div>
        </form>
    </div>
    <script>
        const authForm = document.getElementById('authForm');

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const action = event.submitter?.value || 'login';

            const url = action === 'login' ? '/api/login' : '/api/signup';

            const formData = new FormData(authForm);

            const requestData = {
                username: formData.get('username'),
                password: formData.get('password')
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();
                if (!response.ok) {
                    alert(result.message || '요청을 처리하지 못했습니다.');
                    return;
                }

                if (action === 'login') {
                    window.location.href = 'Subject.html';
                } else {
                    authForm.reset();
                }
            } catch (error) {
                alert('서버에 연결할 수 없습니다. 백엔드 서버가 실행 중인지 확인해 주세요.');
                console.error('요청 오류:', error);
            }
        });
    </script>
</body>

</html>

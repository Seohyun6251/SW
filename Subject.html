<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 과목 입력</title>
    <link rel="stylesheet" href="page-nav.css">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: rgb(253, 250, 250);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }
        .content {
            width: min(700px, 100%);
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            background-color: white;
            box-sizing: border-box;
        }
        #subjectForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .input_d { min-width: 0; }
        input {
            width: 100%;
            height: 39px;
            border-radius: 5px;
            border: solid 1px #888;
            box-sizing: border-box;
            padding: 8px;
        }
        label { display: block; margin-bottom: 8px; }
        .form_buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            height: 40px;
            border-radius: 5px;
            border: solid 1px;
            background-color: black;
            color: white;
            cursor: pointer;
        }
        .subject-list { margin-top: 30px; }
        .subject-list table {
            width: 100%;
            border-collapse: collapse;
        }
        .subject-list th, .subject-list td {
            border: 1px solid #ccc;
            padding: 9px;
            text-align: left;
            overflow-wrap: anywhere;
        }
        .delete-button {
            width: auto;
            padding: 0 10px;
            background-color: #a40000;
        }
        @media (max-width: 560px) {
            .content { padding: 22px; }
            #subjectForm { grid-template-columns: 1fr; }
            .form_buttons { grid-column: 1; }
            .subject-list th, .subject-list td { padding: 6px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <main class="content">
        <h2 style="text-align: center;">시험 과목 및 날짜 입력</h2>

        <form id="subjectForm">
            <div class="input_d">
                <label for="subject">과목명</label>
                <input type="text" id="subject" name="name" placeholder="예: 자료구조" required>
            </div>
            <div class="input_d">
                <label for="date">시험 날짜</label>
                <input type="date" id="date" name="examDate" required>
            </div>
            <div class="input_d">
                <label for="studyNeed">공부 필요도 (0~100)</label>
                <input type="number" id="studyNeed" name="studyNeed" placeholder="60" min="0" max="100" step="1" required>
            </div>
            <div class="input_d">
                <label for="importance">과목 중요도 (1~5)</label>
                <input type="number" id="importance" name="importance" placeholder="1~5" min="1" max="5" step="1" required>
            </div>
            <div class="form_buttons">
                <button type="submit">등록</button>
                <button id="nextPage" type="button">다음 페이지</button>
            </div>
        </form>

        <section class="subject-list">
            <h3>내가 등록한 과목</h3>
            <table>
                <thead>
                    <tr>
                        <th>과목명</th>
                        <th>시험 날짜</th>
                        <th>공부 필요도</th>
                        <th>중요도</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="subjectList"></tbody>
            </table>
        </section>
    </main>

    <script>
        const subjectForm = document.getElementById('subjectForm');
        const subjectList = document.getElementById('subjectList');

        async function deleteSubject(subjectId) {
            if (!confirm('이 과목을 삭제할까요?')) {
                return;
            }

            try {
                const response = await fetch(`/api/subjects/${subjectId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (response.ok) {
                    await loadSubjects();
                } else {
                    alert(result.message || '과목을 삭제하지 못했습니다.');
                }
            } catch (error) {
                alert('서버에 연결할 수 없습니다.');
                console.error('과목 삭제 오류:', error);
            }
        }

        async function loadSubjects() {
            subjectList.replaceChildren();

            try {
                const response = await fetch('/api/subjects');
                const subjects = await response.json();

                if (!response.ok) {
                    alert(subjects.message || '과목을 불러오지 못했습니다.');
                    return;
                }

                if (subjects.length === 0) {
                    return;
                }

                for (const subject of subjects) {
                    const row = document.createElement('tr');
                    const values = [
                        subject.name,
                        subject.exam_date,
                        subject.study_need,
                        subject.importance
                    ];

                    for (const value of values) {
                        const cell = document.createElement('td');
                        cell.textContent = String(value);
                        row.appendChild(cell);
                    }

                    const actionCell = document.createElement('td');
                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.className = 'delete-button';
                    deleteButton.textContent = '삭제';
                    deleteButton.addEventListener('click', () => {
                        deleteSubject(subject.id);
                    });
                    actionCell.appendChild(deleteButton);
                    row.appendChild(actionCell);

                    subjectList.appendChild(row);
                }
            } catch (error) {
                alert('과목을 불러오지 못했습니다. 서버가 실행 중인지 확인해 주세요.');
                console.error('과목 조회 오류:', error);
            }
        }

        subjectForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(subjectForm);
            const requestData = {
                name: formData.get('name'),
                examDate: formData.get('examDate'),
                studyNeed: Number(formData.get('studyNeed')),
                importance: Number(formData.get('importance'))
            };

            try {
                const response = await fetch('/api/subjects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });
                const result = await response.json();

                if (response.ok) {
                    subjectForm.reset();
                    await loadSubjects();
                } else {
                    alert(result.message || '과목을 등록하지 못했습니다.');
                }
            } catch (error) {
                alert('서버에 연결할 수 없습니다.');
                console.error('과목 저장 오류:', error);
            }
        });

        document.getElementById('nextPage').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/subjects');
                const subjects = await response.json();

                if (!response.ok) {
                    alert(subjects.message || '과목을 확인하지 못했습니다.');
                    return;
                }

                if (subjects.length === 0) {
                    alert('과목을 하나 이상 등록해 주세요.');
                    return;
                }

                window.location.href = 'time.html';
            } catch (error) {
                alert('과목을 확인하지 못했습니다. 서버가 실행 중인지 확인해 주세요.');
                console.error('다음 페이지 이동 전 과목 확인 오류:', error);
            }
        });

        loadSubjects();
    </script>
    <script src="page-nav.js" defer></script>
</body>
</html>

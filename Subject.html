<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: rgb(253, 250, 250);
        }

        .content {
            /* background-color: ; */
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background-color: white;
        }

        .input_d {
            margin: 20px;
        }

        input {
            width: 100%;
            height: 39px;
            border-radius: 5px;
            border: solid 1px;
        }

        label {
            margin-bottom: 10px;
        }
        button{
            flex: 1;
            height: 40px;       
            border-radius: 5px;
            border: solid 1px;
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <div class="content">
        <h2 style="text-align: center;">시험과목 및 날짜 입력</h2>
        <form id="subjectForm">
            <div class="input_d">
                <label style="display: block;">과목명</label>
                <input type="text" id="subject" placeholder="예: 자료구조">
            </div>
            <div class="input_d">
                <label style="display: block;">시험 날짜</label>
                <input type="date" id="date">
            </div>
            <div style="display: flex; gap: 10px; margin: 20px;">
                <button type="submit">등록</button>
                <button onclick="location.href='index.html'">다음 페이지</button>
            </div>
        </form>
    </div>
    <script>
        const subjectForm = document.getElementById('subjectForm');

        subjectForm.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
            }
        });

        subjectForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const subject = document.getElementById('subject')
            const date = document.getElementById('date')
            subject.value = ''
            date.value = ''

            console.log(subject.value);
            console.log(date.value);
        });
    </script>
</body>

</html>

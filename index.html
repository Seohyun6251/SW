<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 시간표</title>
    <style>
        th,
        td {
            padding: 12px;
            width: 1000px;
            height: 30px;
        }

        td:hover {
            background-color: #E8F1FF;
        }

        body {
            display: flex;
            /* height: 100vh; */
            justify-content: center;
            align-items: center;
            background-color: rgb(253, 250, 250);
            padding-top: 70px;
        }

        .content {
            /* background-color: ; */
            width: 550px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background-color: white;
        }
    </style>
</head>

<body>
    <div class="content">
        <h1 style="text-align: center;">학습 시간표 입력</h1>
        <div style="text-align: center;">
            <table border="1" style="border-collapse: collapse; margin: auto;">
                <thead>
                    <tr>
                        <th>시간/요일</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                        <th>토</th>
                        <th>일</th>
                    </tr>
                </thead>
                <tbody id="timebody">

                </tbody>
            </table>
        </div>
        <script>
            const pos = {}
            const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
            const timebody = document.getElementById('timebody');
            const start = 9;
            const end = 21;

            for (let hour = start; hour <= end; hour++) {
                const timetr = document.createElement('tr');
                const timetd = document.createElement('td');
                timetd.textContent = `${hour}~${hour + 1}`;
                timetr.appendChild(timetd);

                for (let day = 0; day <= 6; day++) {
                    const daytd = document.createElement('td');
                    timetr.appendChild(daytd);
                    const daykey = days[day];
                    daytd.id = `${daykey}_${hour}`;

                    daytd.addEventListener('click', () => {
                        if (daytd.style.backgroundColor == 'lightblue') {
                            daytd.style.backgroundColor = 'white'
                        } else {
                            daytd.style.backgroundColor = 'lightblue'
                        }

                        if (pos[daytd.id]) {
                            delete pos[daytd.id]
                        }
                        else {
                            pos[daytd.id] = true;
                        }


                    })

                }
                timebody.appendChild(timetr)
            }

        </script>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 시간표</title>
    <style>
        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin: auto;
        }

        th,
        td {
            height: 45px;
            padding: 4px;
            box-sizing: border-box;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        td:hover {
            background-color: #E8F1FF;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(253, 250, 250);
            padding-top: 30px;
        }

        .content {
            width: 700px;
            min-height: 300px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background-color: white;
            box-sizing: border-box;
        }

        button {
            height: 44px;
            width: 110px;
            border-radius: 8px;
            border: solid 1px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="content">
        <h1 style="text-align: center;">학습 시간표 입력</h1>
        <div style="text-align: center;">
            <table border="1">
                <thead>
                    <tr>
                        <th>시간/요일</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                        <th>토</th>
                        <th>일</th>
                    </tr>
                </thead>
                <tbody id="timebody">

                </tbody>
            </table>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const pos = {}
                const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
                const timebody = document.getElementById('timebody');
                const start = 9;
                const end = 21;

                for (let hour = start; hour <= end; hour++) {
                    const timetr = document.createElement('tr');
                    const timetd = document.createElement('td');
                    timetd.textContent = `${hour}~${hour + 1}`;
                    timetr.appendChild(timetd);

                    for (let day = 0; day <= 6; day++) {
                        const daytd = document.createElement('td');
                        timetr.appendChild(daytd);
                        const daykey = days[day];
                        daytd.id = `${daykey}_${hour}`;

                        daytd.addEventListener('click', () => {
                            if (daytd.style.backgroundColor == 'lightblue') {
                                daytd.style.backgroundColor = 'white'
                            } else {
                                daytd.style.backgroundColor = 'lightblue'
                            }
                            if (pos[daytd.id]) {
                                delete pos[daytd.id]
                            }
                            else {
                                pos[daytd.id] = true;
                            }

                        })

                    }
                    timebody.appendChild(timetr)
                }

                document.getElementById('saveSlots').addEventListener('click', async () => {
                    const selectedSlots = Object.keys(pos);

                    if (selectedSlots.length === 0) {
                        alert('공부할 수 있는 시간을 하나 이상 선택해 주세요.');
                        return;
                    }

                    try {
                        const response = await fetch('/api/study-slots', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ slots: selectedSlots })
                        });

                        const result = await response.json();
                        alert(result.message);
                    } catch (error) {
                        alert('서버에 연결할 수 없습니다.');
                        console.error('요청 오류:', error);
                    }
                });
            });
        </script>
    </div>
    <div style="display: flex; gap: 16px; padding: 30px">
        <button style="background-color: white;" onclick="location.href='Subject.html'"><-&nbsp; 이전</button>
                <button id="saveSlots" type="button" style="background-color: black; color: white;">다음 &nbsp;->
                </button>
    </div>
</body>

</html>
